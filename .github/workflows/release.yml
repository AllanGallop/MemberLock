name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = Get-Content -Raw Cargo.toml
          if ($raw -notmatch '(?m)^version = "([^"]+)"') {
            throw "Cargo.toml is missing a version."
          }
          $version = $Matches[1]
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME -replace '^v', ''
            if ($tag -ne $version) {
              throw "Tag v$tag does not match Cargo.toml version $version. Commit the bump, then tag v$version."
            }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\memberlock.exe dist\
          Copy-Item README.md dist\
          $zip = "MemberLock-$version-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path dist\* -DestinationPath $zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MemberLock-windows-x64
          path: MemberLock-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: MemberLock ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: MemberLock-*-windows-x64.zip
